# Journal retention for this host: every container logs here (logging driver
# "journald" in each docker-compose.yml), and so does the host itself (sshd and
# the rest). Install as /etc/systemd/journald.conf.d/30-retention.conf; see DEPLOY.md.
[Journal]
# Keep the journal on disk, so it survives a reboot (needed for incidents).
Storage=persistent
# Nothing older than 30 days. journald deletes an archived file once its FIRST entry is older than
# MaxRetentionSec, but only when it vacuums, which it does as it starts a new file: daily, here
# (MaxFileSec). So a file can outlive that by up to a day, and 29 days keeps every line within 30.
MaxRetentionSec=29day
MaxFileSec=1day
# And never more than 1 GB of disk (Morgane, 2026-11-12, after the disk:/=low
# incident: the journal had grown to 4.5 GB on the root disk). On the VW host
# this cap is reached first, so in practice the journal holds about a week;
# MaxRetentionSec above is the upper bound, not the usual age.
SystemMaxUse=1G
# Every container logs through docker.service, so the per-service rate limit is
# shared by all of them: allow more than the default 10000 lines per 30 s.
RateLimitIntervalSec=30s
RateLimitBurst=50000
