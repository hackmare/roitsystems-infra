version: '3.8'

# Logs go to the host's journal, which keeps them 30 days (infrastructure/journald/,
# see DEPLOY.md). Each line is tagged with the container's name; `docker logs` still works.
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

networks:
  corporate-backend:
    name: corporate-backend
    driver: bridge

services:
  caddy:
    logging: *journald
    # An exact version and its digest, so a rebuild or a pull can't change the server under
    # Vector Weather and the corporate sites without a reviewed PR. Dependabot proposes updates
    # (.github/dependabot.yml); a new image recreates Caddy, so a deploy needs Morgane's go
    # and --allow-caddy-restart (DEPLOY.md).
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ANCHOR_DOMAIN: ${ANCHOR_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    networks:
      - corporate-backend
    depends_on:
      - nats
      - couchdb

  nats:
    logging: *journald
    image: nats:2
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    # nats.conf holds no secrets: each user's password is an environment
    # reference resolved here at startup. An unset variable makes the server
    # refuse to start, so a missing credential can never degrade to open access.
    environment:
      NATS_PASS_AW_BACKEND: ${NATS_PASS_AW_BACKEND}
      NATS_PASS_AW_LLM: ${NATS_PASS_AW_LLM}
      NATS_PASS_AW_CONTROL: ${NATS_PASS_AW_CONTROL}
      NATS_PASS_AW_NOTIFY: ${NATS_PASS_AW_NOTIFY}
      NATS_PASS_AW_NTFY: ${NATS_PASS_AW_NTFY}
      NATS_PASS_CONTACT_API: ${NATS_PASS_CONTACT_API}
      NATS_PASS_CONTACT_WORKER: ${NATS_PASS_CONTACT_WORKER}
      NATS_PASS_CONTACT_NOTIFY: ${NATS_PASS_CONTACT_NOTIFY}
      NATS_PASS_IMAGE_API: ${NATS_PASS_IMAGE_API}
      NATS_PASS_IMAGE_MAGICK: ${NATS_PASS_IMAGE_MAGICK}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf
      - nats-data:/data
    networks:
      - corporate-backend
    ports:
      # Loopback-only: reachable from processes running directly on THIS
      # host (e.g. anchor-weather's container-control daemon, which can't
      # join corporate-backend since it isn't a container), never from
      # outside Docker's usual containers-only boundary AND never from off-
      # host -- "127.0.0.1:" binds only that interface, not 0.0.0.0. Public
      # exposure is unchanged (still none).
      - "127.0.0.1:4222:4222"

  couchdb:
    logging: *journald
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - corporate-backend

volumes:
  caddy-data:
  nats-data:
  couchdb-data:
