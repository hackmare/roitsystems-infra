# NATS server with JetStream enabled
# No public port exposure. Also bound to 127.0.0.1:4222 on the host (see
# infrastructure/docker-compose.yml) for on-host daemons that can't join the
# corporate-backend Docker network -- loopback-only, not reachable off-host.

port: 4222

# HTTP monitoring port (internal only)
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 128MB
  max_file_store: 1GB
}

# Conservative limits for a single-node contact-form workload
max_connections: 100
max_payload: 1MB

# ─────────────────────────────────────────────────────────────────────────────
# Authentication and per-client authorization
#
# Every client gets its own account with a permission set covering exactly the
# subjects it uses. Network reachability is no longer sufficient to publish or
# subscribe: a process that reaches the port without credentials is refused.
#
# NO SECRETS IN THIS FILE. Each password is an environment-variable reference
# resolved by the NATS server at startup; the values are supplied to the nats
# container from infrastructure/.env (see .env.example). The same value also
# appears in the consuming service's own NATS_URL
# (nats://<user>:<password>@nats:4222). Rotating a credential is an .env edit
# plus a config reload -- it never touches this repo.
#
# Permissions are defined as named variables and referenced from `users` below,
# so each client's surface can be read in one place.
#
# JetStream note: a client that uses JetStream needs more than its data
# subjects. It must also be able to reach the $JS.API endpoints for the streams
# it owns, ack on $JS.ACK, and receive replies on its own _INBOX. Those are
# scoped per stream rather than granted as a blanket $JS.API.> so that a client
# cannot create, modify or drain a stream belonging to another service. If a
# client ever fails with "permissions violation for publish to $JS.API...",
# the missing endpoint is named in the error -- add that one, rather than
# widening to $JS.API.>.
#
# $JS.API.STREAM.NAMES appears in every JetStream client's list because
# nats-py's pull_subscribe() resolves which stream carries a subject before it
# can create a consumer. Without it, fetch() times out silently rather than
# raising anything useful -- which is exactly how it presented in testing. It
# is a read-only lookup: it returns stream NAMES, never message data.
# ─────────────────────────────────────────────────────────────────────────────

# --- anchor-weather: API/worker/scheduler (one image, one trust domain) ------
# Publishes user/ops email events, and control commands consumed by the
# on-host container-control daemon. Owns the ANCHOR_WEATHER_CONTROL stream.
AW_BACKEND = {
  publish = {
    allow = [
      "anchor.weather.user.comms"
      "anchor-weather-control.command"
      "$JS.API.INFO"
      "$JS.API.STREAM.NAMES"   # subject->stream lookup; see note above
      "$JS.API.STREAM.CREATE.ANCHOR_WEATHER_CONTROL"
      "$JS.API.STREAM.UPDATE.ANCHOR_WEATHER_CONTROL"
      "$JS.API.STREAM.INFO.ANCHOR_WEATHER_CONTROL"
      "$JS.API.CONSUMER.CREATE.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.INFO.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.MSG.NEXT.ANCHOR_WEATHER_CONTROL.>"
      "$JS.ACK.ANCHOR_WEATHER_CONTROL.>"
    ]
  }
  subscribe = {
    allow = [
      "anchor-weather-control.status"
      "_INBOX.>"
    ]
  }
}

# --- anchor-weather: llm-service ---------------------------------------------
# Only emits a provider-switch notification. No JetStream, no subscriptions.
AW_LLM = {
  publish   = { allow = ["anchor.weather.user.comms"] }
  subscribe = { allow = ["_INBOX.>"] }
}

# --- anchor-weather: container-control daemon (on-host, systemd) -------------
# The mirror image of AW_BACKEND: consumes commands, reports status. This is
# the only client permitted to read anchor-weather-control.command.
AW_CONTROL = {
  publish = {
    allow = [
      "anchor-weather-control.status"
      "$JS.API.INFO"
      "$JS.API.STREAM.NAMES"   # subject->stream lookup; see note above
      "$JS.API.STREAM.CREATE.ANCHOR_WEATHER_CONTROL"
      "$JS.API.STREAM.UPDATE.ANCHOR_WEATHER_CONTROL"
      "$JS.API.STREAM.INFO.ANCHOR_WEATHER_CONTROL"
      "$JS.API.CONSUMER.CREATE.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.INFO.ANCHOR_WEATHER_CONTROL.>"
      "$JS.API.CONSUMER.MSG.NEXT.ANCHOR_WEATHER_CONTROL.>"
      "$JS.ACK.ANCHOR_WEATHER_CONTROL.>"
    ]
  }
  subscribe = {
    allow = [
      "anchor-weather-control.command"
      "_INBOX.>"
    ]
  }
}

# --- anchor-weather: email bridge (consumer only) ----------------------------
AW_NOTIFY = {
  publish   = { deny  = [">"] }
  subscribe = { allow = ["anchor.weather.user.comms", "_INBOX.>"] }
}

# --- contact-inbox: API ------------------------------------------------------
# Owns the CONTACT_MESSAGES stream.
CONTACT_API = {
  publish = {
    allow = [
      "contact.messages.*"
      "$JS.API.INFO"
      "$JS.API.STREAM.NAMES"   # subject->stream lookup; see note above
      "$JS.API.STREAM.CREATE.CONTACT_MESSAGES"
      "$JS.API.STREAM.UPDATE.CONTACT_MESSAGES"
      "$JS.API.STREAM.INFO.CONTACT_MESSAGES"
      "$JS.ACK.CONTACT_MESSAGES.>"
    ]
  }
  subscribe = { allow = ["_INBOX.>"] }
}

# --- contact-inbox: worker ---------------------------------------------------
# Consumes CONTACT_MESSAGES (durable "worker") and republishes image.ready.
CONTACT_WORKER = {
  publish = {
    allow = [
      "image.ready"
      "$JS.API.INFO"
      "$JS.API.STREAM.NAMES"   # subject->stream lookup; see note above
      "$JS.API.STREAM.INFO.CONTACT_MESSAGES"
      "$JS.API.CONSUMER.CREATE.CONTACT_MESSAGES.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.CONTACT_MESSAGES.>"
      "$JS.API.CONSUMER.INFO.CONTACT_MESSAGES.>"
      "$JS.API.CONSUMER.MSG.NEXT.CONTACT_MESSAGES.>"
      "$JS.ACK.CONTACT_MESSAGES.>"
    ]
  }
  subscribe = { allow = ["contact.messages.*", "_INBOX.>"] }
}

# --- contact-inbox: notification bridge (consumer only) ----------------------
CONTACT_NOTIFY = {
  publish   = { deny  = [">"] }
  subscribe = { allow = ["contact.messages.new", "_INBOX.>"] }
}

# --- image-converter: API ----------------------------------------------------
# Owns the IMAGE_JOBS stream; consumes image.ready (durable "api").
IMAGE_API = {
  publish = {
    allow = [
      "image.convert"
      "$JS.API.INFO"
      "$JS.API.STREAM.NAMES"   # subject->stream lookup; see note above
      "$JS.API.STREAM.CREATE.IMAGE_JOBS"
      "$JS.API.STREAM.UPDATE.IMAGE_JOBS"
      "$JS.API.STREAM.INFO.IMAGE_JOBS"
      "$JS.API.CONSUMER.CREATE.IMAGE_JOBS.>"
      "$JS.API.CONSUMER.DURABLE.CREATE.IMAGE_JOBS.>"
      "$JS.API.CONSUMER.INFO.IMAGE_JOBS.>"
      "$JS.API.CONSUMER.MSG.NEXT.IMAGE_JOBS.>"
      "$JS.ACK.IMAGE_JOBS.>"
    ]
  }
  subscribe = { allow = ["image.ready", "_INBOX.>"] }
}

# --- image-converter: imagemagick worker -------------------------------------
# Core pub/sub only (no JetStream): takes image.convert, returns image.ready.
IMAGE_MAGICK = {
  publish   = { allow = ["image.ready", "image.convert"] }
  subscribe = { allow = ["image.convert", "image.ready", "_INBOX.>"] }
}

# --- migration shim ----------------------------------------------------------
# MIGRATION ONLY -- delete this block and the no_auth_user line below once
# every client has been moved onto its own credentials. While no_auth_user is
# set, a client that connects WITHOUT credentials is silently accepted and
# mapped to this user, so services can be cut over one at a time instead of
# all at once. Until it is removed, this file does not yet restrict anything:
# an unauthenticated client still gets these permissions.
#
# Verify before removing:
#   curl -s http://nats:8222/connz?auth=1 | grep -c '"authorized_user":"legacy-open"'
# must be 0.
LEGACY_OPEN = {
  publish   = { allow = [">"] }
  subscribe = { allow = [">"] }
}

authorization {
  users = [
    { user: "aw-backend",     password: $NATS_PASS_AW_BACKEND,     permissions: $AW_BACKEND }
    { user: "aw-llm",         password: $NATS_PASS_AW_LLM,         permissions: $AW_LLM }
    { user: "aw-control",     password: $NATS_PASS_AW_CONTROL,     permissions: $AW_CONTROL }
    { user: "aw-notify",      password: $NATS_PASS_AW_NOTIFY,      permissions: $AW_NOTIFY }
    { user: "contact-api",    password: $NATS_PASS_CONTACT_API,    permissions: $CONTACT_API }
    { user: "contact-worker", password: $NATS_PASS_CONTACT_WORKER, permissions: $CONTACT_WORKER }
    { user: "contact-notify", password: $NATS_PASS_CONTACT_NOTIFY, permissions: $CONTACT_NOTIFY }
    { user: "image-api",      password: $NATS_PASS_IMAGE_API,      permissions: $IMAGE_API }
    { user: "image-magick",   password: $NATS_PASS_IMAGE_MAGICK,   permissions: $IMAGE_MAGICK }

    # MIGRATION ONLY -- remove with no_auth_user below.
    { user: "legacy-open",    password: $NATS_PASS_LEGACY_OPEN,    permissions: $LEGACY_OPEN }
  ]
}

# MIGRATION ONLY -- while this is set, unauthenticated clients are accepted as
# `legacy-open`. Removing this line (and the user above) is the step that
# actually closes the door; do it only once connz shows no legacy-open
# connections. See infrastructure/nats/README.md.
no_auth_user: legacy-open
