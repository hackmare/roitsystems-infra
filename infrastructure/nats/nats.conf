# NATS server with JetStream enabled
# No public port exposure. Also bound to 127.0.0.1:4222 on the host (see
# infrastructure/docker-compose.yml) for on-host daemons that can't join the
# corporate-backend Docker network -- loopback-only, not reachable off-host.

port: 4222

# HTTP monitoring port (internal only)
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 128MB
  max_file_store: 1GB
}

# Conservative limits for a single-node contact-form workload
max_connections: 100
max_payload: 1MB
