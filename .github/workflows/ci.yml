# CI for the Node services: install, build, build the image (never pushed), and the smoke test where a
# service has one (scripts/smoke/run.sh). Pull requests only: no secrets, read-only token, nothing deployed.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # name: as scripts/smoke/run.sh knows it; node: the major version in the service's Dockerfile
          - { name: anchor-weather-notifications, dir: corporate-network/anchor-weather-notifications, node: "22" }
          - { name: contact-inbox-api, dir: corporate-network/contact-inbox/api, node: "20" }
          - { name: contact-inbox-notification-service, dir: corporate-network/contact-inbox/notification-service, node: "18" }
          - { name: contact-inbox-worker, dir: corporate-network/contact-inbox/worker, node: "20" }
          - { name: image-converter-api, dir: corporate-network/image-converter/api, node: "20" }
          - { name: image-converter-imagemagick-service, dir: corporate-network/image-converter/imagemagick-service, node: "18" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::${{ matrix.dir }} has no package-lock.json: npm install, not reproducible"
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm run build
          else
            for f in $(node -e 'const p=require("./package.json"); console.log(p.main || "index.js")'); do node --check "$f"; done
          fi

      - name: Build the image (not pushed)
        run: docker build -t "ci/${{ matrix.name }}:${{ github.sha }}" "${{ matrix.dir }}"

      - name: Smoke test
        env:
          IMAGE: ci/${{ matrix.name }}:${{ github.sha }}
          NAME: ${{ matrix.name }}
        run: |
          if [ ! -x scripts/smoke/run.sh ]; then
            echo "::notice::scripts/smoke/run.sh not in this branch yet; smoke test skipped"
          elif scripts/smoke/run.sh --list | grep -qx "$NAME"; then
            scripts/smoke/run.sh "$NAME"
          else
            echo "::notice::no smoke test for $NAME yet"
          fi
