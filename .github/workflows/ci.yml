# CI for the Node services: install, build, unit tests, build the image (never pushed), and the smoke test where a
# service has one (scripts/smoke/run.sh). Pull requests and pushes to main (so main's builds are checked):
# no secrets, read-only token, nothing deployed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # name: as scripts/smoke/run.sh knows it
          - { name: anchor-weather-notifications, dir: corporate-network/anchor-weather-notifications }
          - { name: contact-inbox-api, dir: corporate-network/contact-inbox/api }
          - { name: contact-inbox-notification-service, dir: corporate-network/contact-inbox/notification-service }
          - { name: contact-inbox-worker, dir: corporate-network/contact-inbox/worker }
          - { name: image-converter-api, dir: corporate-network/image-converter/api }
          - { name: image-converter-imagemagick-service, dir: corporate-network/image-converter/imagemagick-service }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Node version from the Dockerfile
        id: node
        run: |
          v=$(sed -n -E 's/^FROM node:([0-9]+).*/\1/p' "${{ matrix.dir }}/Dockerfile" | head -n 1)
          [ -n "$v" ] || { echo "::error::no FROM node:<major> in ${{ matrix.dir }}/Dockerfile"; exit 1; }
          echo "major=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.major }}

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::${{ matrix.dir }} has no package-lock.json: npm install, not reproducible"
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm run build
          else
            for f in $(node -e 'const p=require("./package.json"); console.log(p.main || "index.js")'); do node --check "$f"; done
          fi

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: |
          if node -e 'const t = require("./package.json").scripts?.test || ""; process.exit(t && !/No automated tests/.test(t) ? 0 : 1)'; then
            npm test
          else
            echo "::notice::no tests for ${{ matrix.name }} yet"
          fi

      - name: Build the image (not pushed)
        run: docker build -t "ci/${{ matrix.name }}:${{ github.sha }}" "${{ matrix.dir }}"

      - name: Smoke test
        env:
          IMAGE: ci/${{ matrix.name }}:${{ github.sha }}
          NAME: ${{ matrix.name }}
        run: |
          if [ ! -x scripts/smoke/run.sh ]; then
            echo "::notice::scripts/smoke/run.sh not in this branch yet; smoke test skipped"
          elif scripts/smoke/run.sh --list | grep -qx "$NAME"; then
            scripts/smoke/run.sh "$NAME"
          else
            echo "::notice::no smoke test for $NAME yet"
          fi
