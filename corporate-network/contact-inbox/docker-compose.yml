version: '3.8'

# Logs go to the host's journal, which keeps them 30 days (infrastructure/journald/,
# see DEPLOY.md). Each line is tagged with the container's name; `docker logs` still works.
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

networks:
  corporate-backend:
    external: true

services:
  contact-inbox-api:
    logging: *journald
    build: ./api
    container_name: contact-inbox-api
    # Least privilege (as anchor-weather-notifications, #125): the image's node user, a
    # read-only filesystem, no Linux capabilities, no privilege escalation.
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_DOMAIN: ${API_DOMAIN}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_USER: contact-api
      NATS_PASS: ${NATS_PASS_CONTACT_API}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SESSION_SECRET: ${SESSION_SECRET}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
    networks:
      - corporate-backend
    restart: unless-stopped

  contact-inbox-worker:
    logging: *journald
    build: ./worker
    container_name: contact-inbox-worker
    # Least privilege (as anchor-weather-notifications, #125): the image's node user, a
    # read-only filesystem, no Linux capabilities, no privilege escalation.
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_USER: contact-worker
      NATS_PASS: ${NATS_PASS_CONTACT_WORKER}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    networks:
      - corporate-backend
    restart: unless-stopped

  contact-inbox-notification:
    logging: *journald
    build: ./notification-service
    container_name: contact-inbox-notification
    # Least privilege (as anchor-weather-notifications, #125): the image's node user, a
    # read-only filesystem, no Linux capabilities, no privilege escalation.
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      NATS_USER: contact-notify
      NATS_PASS: ${NATS_PASS_CONTACT_NOTIFY}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    networks:
      - corporate-backend
    restart: unless-stopped
