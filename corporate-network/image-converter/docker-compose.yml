version: '3.8'

# Logs go to the host's journal: 1 GB, about a week, never over 30 days (infrastructure/journald/,
# see DEPLOY.md). Each line is tagged with the container's name; `docker logs` still works.
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

networks:
  corporate-backend:
    external: true

volumes:
  imagemagick-tmp: {}            # imagemagick-service's /tmp: scratch only, nothing kept

services:
  image-converter-api:
    logging: *journald
    build: ./api
    container_name: image-converter-api
    # Least privilege (as anchor-weather-notifications, #125): the image's node user, a
    # read-only filesystem, no Linux capabilities, no privilege escalation.
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_USER: image-api
      NATS_PASS: ${NATS_PASS_IMAGE_API}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SESSION_SECRET: ${SESSION_SECRET}
    networks:
      - corporate-backend
    restart: unless-stopped

  imagemagick-service:
    logging: *journald
    build: ./imagemagick-service
    container_name: imagemagick-service
    # Least privilege (as anchor-weather-notifications, #125): the image's node user, a
    # read-only filesystem, no Linux capabilities, no privilege escalation.
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Its inputs and outputs, and ImageMagick's pixel cache when it spills (policy.xml:
    # map 512 MiB, disk 1 GiB), go to /tmp. That stays on disk, a volume, not a tmpfs:
    # a tmpfs is RAM inside mem_limit, and with it a 16 MP image was refused that main
    # converts (github-68, github-86 on #127). The rest of the filesystem is read-only.
    volumes:
      - imagemagick-tmp:/tmp
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_URL: nats://nats:4222
      NATS_USER: image-magick
      NATS_PASS: ${NATS_PASS_IMAGE_MAGICK}
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    networks:
      - corporate-backend
    restart: unless-stopped
    # Backstop: ImageMagick on a large image can use a lot of memory; this caps
    # the container rather than the shared host.
    mem_limit: 512m
