version: '3.8'

# Logs go to the host's journal, which keeps them 30 days (infrastructure/journald/,
# see DEPLOY.md). Each line is tagged with the container's name; `docker logs` still works.
x-logging: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

networks:
  corporate-backend:
    external: true

services:
  anchor-weather-notifications:
    logging: *journald
    build: .
    container_name: anchor-weather-notifications
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NATS_URL: nats://nats:4222
      NATS_USER: aw-notify
      NATS_PASS: ${NATS_PASS_AW_NOTIFY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-info@selkietech.ca}
      NOTIFICATION_FROM_NAME: ${NOTIFICATION_FROM_NAME:-Vector Weather}
    networks:
      - corporate-backend
    restart: unless-stopped
