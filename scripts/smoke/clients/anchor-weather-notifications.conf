# No real email: a dummy key, and Resend's API pointed at a fake server that the
# smoke client runs inside the container. The service refuses any other API base
# unless RESEND_ALLOW_TEST_BASE_URL=1, which is set here and nowhere else.
ENV=(-e NATS_URL="$NATS_URL" -e RESEND_API_KEY=re_smoke_test_only_not_a_key
     -e RESEND_BASE_URL=http://127.0.0.1:8025 -e RESEND_ALLOW_TEST_BASE_URL=1)

# The service's log must not contain recipients' addresses or names, or the email
# itself: only the notification type and status.
post_check() {
  local leaks
  leaks=$(docker logs "$SVC" 2>&1 | grep -oE 'smoke@example\.invalid|cc@example\.invalid|Smoke Test|Smoke body|<p>x</p>|no body' | sort -u)
  if [[ -n $leaks ]]; then echo "FAIL personal data in the service log: $(echo $leaks)"; return 1; fi
  echo "ok   no recipient addresses, names or email content in the service log"
}
