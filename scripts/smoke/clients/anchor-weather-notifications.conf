# No real email: a dummy key, and Resend's API pointed at a fake server that the
# smoke client runs inside the container. The service refuses any other API base
# unless RESEND_ALLOW_TEST_BASE_URL=1, which is set here and nowhere else.
ENV=(-e NATS_URL="$NATS_URL" -e RESEND_API_KEY=re_smoke_test_only_not_a_key
     -e RESEND_BASE_URL=http://127.0.0.1:8025 -e RESEND_ALLOW_TEST_BASE_URL=1)
