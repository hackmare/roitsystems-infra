# The service as prod runs it: run.sh starts it with this compose service's user,
# read_only, capabilities, security_opt, tmpfs, volumes and mem_limit.
COMPOSE_FILE=corporate-network/image-converter/docker-compose.yml
COMPOSE_SERVICE=image-converter-api

# SESSION_SECRET: an obviously fake test-only value (the APIs refuse fewer than 32 characters).
JETSTREAM=1
COUCH=1
ENV=(-e NATS_URL="$NATS_URL" -e COUCHDB_URL="$COUCH_URL" -e COUCHDB_USER="$COUCH_USER"
     -e COUCHDB_PASSWORD="$COUCH_PASS" -e PORT=3000 -e SESSION_SECRET=smoke-test-only-not-a-secret-0000000000000000000000000000000000
     -e CORS_ORIGINS=https://roitsystems.ca -e ADMIN_EMAILS=smoke@example.invalid)
