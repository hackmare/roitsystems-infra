# SESSION_SECRET: an obviously fake test-only value (the APIs refuse fewer than 32 characters).
JETSTREAM=1
COUCH=1
ENV=(-e NATS_URL="$NATS_URL" -e COUCHDB_URL="$COUCH_URL" -e COUCHDB_USER="$COUCH_USER"
     -e COUCHDB_PASSWORD="$COUCH_PASS" -e PORT=3000 -e SESSION_SECRET=smoke-test-only-not-a-secret-0000000000000000000000000000000000
     -e CORS_ORIGINS=https://roitsystems.ca -e GOOGLE_CLIENT_ID=smoke -e GOOGLE_CLIENT_SECRET=smoke
     -e ADMIN_EMAILS=smoke@example.invalid -e RATE_LIMIT_MAX=50)

# The service's log must not contain what visitors submit (personal data): send a
# valid and an invalid submission with distinctive values, then search the log.
post_check() {
  docker exec "$SVC" node -e '
    const post = (b) => fetch("http://localhost:3000/api/contact", { method: "POST",
      // Its own client address, so rate limits other checks used up do not apply.
      headers: { "Content-Type": "application/json", Origin: "https://roitsystems.ca", "CF-Connecting-IP": "192.0.2.99" },
      body: JSON.stringify(b) });
    (async () => {
      const ok = await post({ name: "PiiProbe Name", email: "pii-probe@example.invalid", company: "PiiProbe Company",
        subject: "pii-probe-subject", message: "pii-probe message body, please ignore.", source_page: "pii-probe-page" });
      const bad = await post({ name: "PiiProbe Bad", email: "pii-probe-bad@example.invalid", message: "x" });
      if (ok.status !== 200 || bad.status !== 400) { console.log("probe statuses", ok.status, bad.status); process.exit(1); }
    })();' || { echo "FAIL log probe submissions were not accepted/refused as expected"; return 1; }
  sleep 1
  local leaks
  leaks=$(docker logs "$SVC" 2>&1 | grep -oiE 'piiprobe[^"]*|pii-probe[^"]*' | sort -u)
  if [[ -n $leaks ]]; then echo "FAIL visitor data in the service log: $(echo $leaks | cut -c1-200)"; return 1; fi
  echo "ok   no submitted names, emails, companies, subjects or messages in the service log"
}
