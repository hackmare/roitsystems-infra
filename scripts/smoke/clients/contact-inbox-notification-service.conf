# Nothing leaves the container: CouchDB, Anthropic and Resend are fakes that the
# smoke client runs on 127.0.0.1, with dummy keys. The service refuses any other
# Resend or Anthropic API base unless the matching *_ALLOW_TEST_BASE_URL=1, which
# is set here and nowhere else.
ENV=(-e NATS_URL="$NATS_URL" -e COUCHDB_URL=http://127.0.0.1:8026 -e COUCHDB_USER=smoke -e COUCHDB_PASSWORD=smoke
     -e RESEND_API_KEY=re_smoke_test_only_not_a_key -e RESEND_BASE_URL=http://127.0.0.1:8025 -e RESEND_ALLOW_TEST_BASE_URL=1
     -e CLAUDE_API_KEY=sk-smoke-test-only-not-a-key -e ANTHROPIC_BASE_URL=http://127.0.0.1:8027 -e ANTHROPIC_ALLOW_TEST_BASE_URL=1
     -e NOTIFICATION_EMAIL=inbox@example.invalid -e NOTIFICATION_FROM_EMAIL=from@example.invalid)

# The service's log must not contain the sender's details, the message or the
# analysis (all personal data): only ids, lengths and status.
post_check() {
  local leaks
  leaks=$(docker logs "$SVC" 2>&1 | grep -oE 'sender@example\.invalid|Smoke subject|Smoke test message|SMOKE-PAIN-POINT|eve@example\.invalid|smoke-hostile <img|Smoke Sender' | sort -u)
  if [[ -n $leaks ]]; then echo "FAIL personal data in the service log: $(echo $leaks)"; return 1; fi
  echo "ok   no sender details, message text or analysis in the service log"
}
