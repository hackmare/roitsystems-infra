JETSTREAM=1
COUCH=1
ENV=(-e NATS_URL="$NATS_URL" -e COUCHDB_URL="$COUCH_URL" -e COUCHDB_USER="$COUCH_USER"
     -e COUCHDB_PASSWORD="$COUCH_PASS")

# In production contact-inbox/api creates this stream; the worker only attaches to it.
# Same settings as api/src/services/nats.ts.
setup() {
  docker run --rm --network "$NET" -e NATS_URL="$NATS_URL" --entrypoint node "$IMAGE" -e '
    const { connect, StorageType, RetentionPolicy } = require("nats");
    (async () => {
      const nc = await connect({ servers: process.env.NATS_URL });
      await (await nc.jetstreamManager()).streams.add({ name: "CONTACT_MESSAGES",
        subjects: ["contact.messages.*"], storage: StorageType.File, retention: RetentionPolicy.Limits,
        max_age: 30 * 24 * 60 * 60 * 1e9, num_replicas: 1 });
      await nc.close();
    })().catch((e) => { console.error(e); process.exit(1); });'
}

# The worker's log must not contain the stored message's personal data.
post_check() {
  local leaks
  leaks=$(docker logs "$SVC" 2>&1 | grep -oE 'smoke@example\.invalid|Smoke test message' | sort -u)
  if [[ -n $leaks ]]; then echo "FAIL personal data in the worker log: $(echo $leaks)"; return 1; fi
  echo "ok   no sender details or message text in the worker log"
}
